<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: #05070d;
    color: #dbe7f3;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    position: relative;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(900px 520px at 18% 42%, rgba(34,211,238,.16), transparent 62%),
      radial-gradient(700px 500px at 88% 10%, rgba(45,212,191,.10), transparent 60%),
      linear-gradient(135deg, #071019 0%, #05070d 55%, #08131d 100%);
  }
  .grid {
    position: absolute; inset: 0; opacity: .22;
    background-image:
      linear-gradient(rgba(34,211,238,.18) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,.18) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(circle at 50% 50%, #000 30%, transparent 78%);
  }
  .wrap {
    position: relative; height: 100%;
    display: grid; grid-template-columns: 430px 1fr;
    align-items: center; padding: 64px 76px;
  }
  .logo { display: flex; justify-content: center; }
  .logo img { width: 330px; height: 330px; filter: drop-shadow(0 0 38px rgba(34,211,238,.22)); }
  .content { padding-left: 30px; }
  .kicker {
    font: 600 18px/1.2 Consolas, monospace; letter-spacing: .28em;
    color: #22d3ee; text-transform: uppercase; margin-bottom: 18px;
  }
  h1 {
    margin: 0; font-size: 76px; line-height: .98; letter-spacing: -.02em;
    font-weight: 800; color: #f2f8fd;
  }
  h1 span { color: #22d3ee; }
  .sub {
    margin-top: 18px; font-size: 27px; line-height: 1.42; color: #a9c0d4;
    max-width: 660px;
  }
  .zh { margin-top: 12px; font-size: 22px; color: #7f9bb2; }
  .chips { display: flex; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
  .chip {
    border: 1px solid #1d3b4d; background: rgba(9,20,30,.75);
    color: #8fd8e8; border-radius: 999px; padding: 8px 16px;
    font: 600 16px/1 Consolas, monospace;
  }
  .chip.green { color: #6ee7b7; border-color: #1d4b3e; }
  .chip.amber { color: #fcd34d; border-color: #4a3d1c; }
  .url {
    position: absolute; left: 76px; bottom: 34px;
    font: 500 17px/1 Consolas, monospace; color: #57748a; letter-spacing: .04em;
  }
  .accent {
    position: absolute; right: 0; top: 0; width: 8px; height: 100%;
    background: linear-gradient(180deg, transparent, #22d3ee, transparent);
    opacity: .65;
  }
</style>
</head>
<body>
  <div class="bg"></div><div class="grid"></div><div class="accent"></div>
  <div class="wrap">
    <div class="logo"><img src="logo.svg" alt="CyberCensus logo"></div>
    <div class="content">
      <div class="kicker">Attack Surface · Evidence First</div>
      <h1>Cyber<span>Census</span></h1>
      <div class="sub">Find every exposed asset.<br>Prove every attribution.</div>
      <div class="zh">给一个单位名称 / 域名 / IP，找全暴露资产，并用证据证明归属。</div>
      <div class="chips">
        <span class="chip">A/B/C EVIDENCE</span>
        <span class="chip green">CONFIRMED</span>
        <span class="chip amber">SUSPECTED</span>
        <span class="chip">REJECTED</span>
        <span class="chip">PASSIVE-FIRST</span>
      </div>
    </div>
  </div>
  <div class="url">github.com/Zerdon-me/CyberCensus</div>
</body>
</html>

name: Build Windows EXE

# 推送 tag（如 v1.0.0）时自动打包 CyberCensus.exe 并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install customtkinter dnspython cryptography pypinyin pyinstaller

      - name: Build single-file EXE
        run: |
          pyinstaller --onefile --windowed --name CyberCensus --collect-all customtkinter --collect-all pypinyin asm_gui.pyw

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CyberCensus.exe
          generate_release_notes: true

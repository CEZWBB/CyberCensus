name: 功能建议
description: 新数据源、新证据、界面/报告改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 现在哪里不够用？例如"某类资产总是漏报""报告不好交付"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望工具怎么改？有参考工具或平台也可以写上
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代办法
      description: 当前是怎么绕过这个问题的？
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该功能只用于自有或已获书面授权的目标
          required: true
        - label: 该功能不包含弱口令爆破、验证码绕过、批量攻击或规避检测
          required: true
